name: Deploy Laravel to Hosting via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Memungkinkan trigger deploy manual dari tab Actions di GitHub

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository code
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Setup Node.js Environment
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Build Frontend Assets (Vite / Tailwind)
      - name: 🎨 Build Frontend Assets
        run: |
          npm ci
          npm run build

      # 4. Deploy to Hosting Server via FTP (Fast sync tanpa vendor)
      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.example
            **/phpunit.xml
            **/README.md
            **/.editorconfig
            **/.npmrc
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/*.zip

