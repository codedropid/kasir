name: Deploy Laravel to Hosting via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Memungkinkan trigger deploy manual dari tab Actions di GitHub

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository code
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Setup PHP Environment (PHP 8.3 untuk Laravel 11)
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, curl, fileinfo, gd, zip, openssl, bcmath
          coverage: none

      # 3. Install Composer Dependencies (Production only)
      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 4. Setup Node.js Environment
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 5. Build Frontend Assets (Vite / Tailwind)
      - name: 🎨 Build Frontend Assets
        run: |
          npm ci
          npm run build

      # 6. Deploy to Hosting Server via FTP
      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.example
            **/phpunit.xml
            **/README.md
            **/.editorconfig
            **/.npmrc
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/kode kasir.zip
